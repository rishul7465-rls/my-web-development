<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic HTML setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelEase</title>

    <!-- External CSS file: styling is in style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- POINT 9.3: Navbar uses Flexbox in CSS -->
    <nav>
        <h2 class="logo">TravelEase</h2>

        <!-- Navigation links -->
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Trips</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <!-- Hero section: main landing page content -->
    <section class="hero">
        <h1>Plan your next trip in minutes</h1>
        <p>Simple, cheap and fun travel plans.</p>

        <!-- POINT 9.2: Image responsiveness is set in CSS.
             Keep your photo at img/hero.jpg -->
        <img src="img\mountain image .jpeg"
             alt="Mountain trip banner"
             class="hero-img">
    </section>

    <!-- POINT 9.3: Features section uses CSS Grid -->
    <section class="features">

        <div class="box">
            <div class="icon" aria-hidden="true">✈️</div>
            <h3>Easy Booking</h3>
            <p>Book in 3 clicks.</p>
        </div>

        <div class="box">
            <div class="icon" aria-hidden="true">💰</div>
            <h3>Best Prices</h3>
            <p>We compare for you.</p>
        </div>

        <div class="box">
            <div class="icon" aria-hidden="true">🤝</div>
            <h3>24x7 Help</h3>
            <p>We are always online.</p>
        </div>

    </section>

    <!-- Footer of the landing page -->
    <footer>
        Made by a first year student
    </footer>

</body>
</html>
