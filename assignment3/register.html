<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for the Coding Club">
    <title>Coding Club - Register</title>
    <link rel="icon" href="favicon.ico">
</head>
<body>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="register.html">Register</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <header>
        <h1>Coding Club Registration</h1>
        <p>Fill in your details to join our club.</p>
    </header>

    <main>
        <form action="#" method="get">

            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Your name" required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="password">Password:</label>
                <input type="password" id="password"
                       name="password" required>
            </p>

            <p>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">
            </p>

            <p>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
            </p>

            <p>Gender:</p>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <p>Interests:</p>
            <input type="checkbox" id="web" name="interests" value="Web">
            <label for="web">Web Development</label>

            <input type="checkbox" id="dsa" name="interests" value="DSA">
            <label for="dsa">DSA</label>

            <p>
                <label for="branch">Branch:</label>
                <select id="branch" name="branch">
                    <option value="BCA">BCA</option>
                    <option value="BTech">B.Tech</option>
                    <option value="Other">Other</option>
                </select>
            </p>

            <p>
                <label for="message">Why do you want to join?</label>
                <br>
                <textarea id="message" name="message"
                          rows="4" cols="30"></textarea>
            </p>

            <button type="submit">Register</button>

        </form>
    </main>

    <footer>
        <p>Made by Rishul Gangwar</p>
    </footer>

</body>
</html>
