<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coding Club</title>

    <!-- 5.3: Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- 5.1: Write CSS inside the style tag -->
    <style>

        /* =====================================
           5.4: CSS VARIABLES USING :root
           Keep colours and spacing in one place
        ====================================== */

        :root {
            --brand: #2f5bea;
            --light: #eef2ff;
            --dark: #1b2440;
            --gap: 16px;
        }


        /* =====================================
           5.2 (a): UNIVERSAL SELECTOR (*)
        ====================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================
           5.3: FONT, COLOURS AND LINE-HEIGHT
        ====================================== */

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light);
            color: var(--dark);
            font-size: 16px;
            line-height: 1.6;
            padding: var(--gap);
        }


        /* =====================================
           5.2 (b): ELEMENT SELECTOR (h1)
        ====================================== */

        h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        p {
            margin-bottom: 8px;
        }


        /* =====================================
           5.2 (c): CLASS SELECTOR (.card)
        ====================================== */

        .card {
            background: white;
            padding: var(--gap);
            margin: 0 auto 20px;
            border-radius: 10px;
            max-width: 900px;
            box-shadow: 0 3px 10px rgba(27, 36, 64, 0.08);
        }


        /* =====================================
           5.2 (d): ID SELECTOR (#hero)
        ====================================== */

        #hero {
            background: var(--brand);
            color: white;
            text-align: center;
            padding: 32px var(--gap);
            border-radius: 10px;
            margin: 0 auto 24px;
            max-width: 900px;
        }

        #hero p {
            margin-bottom: 0;
        }


        /* =====================================
           TABLE STYLING
        ====================================== */

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        th {
            background: var(--brand);
            color: white;
            text-align: left;
        }

        th,
        td {
            padding: 8px;
            border-bottom: 1px solid #ccc;
        }

        tbody tr:hover {
            background: var(--light);
        }


        /* =====================================
           REGISTRATION FORM STYLING
        ====================================== */

        label {
            display: block;
            margin-top: 8px;
        }

        input {
            width: 100%;
            max-width: 350px;
            padding: 8px;
            margin: 4px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
        }

        button {
            background: var(--brand);
            color: white;
            border: none;
            padding: 10px 18px;
            margin-top: 10px;
            border-radius: 6px;
            font-family: inherit;
            cursor: pointer;
        }

        button:hover {
            background: var(--dark);
        }


        /* =====================================
           RESPONSIVE DESIGN
        ====================================== */

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .card {
                padding: 12px;
            }

            th,
            td {
                padding: 6px;
                font-size: 13px;
            }
        }

    </style>
</head>

<body>

    <!-- =====================================
         CODING CLUB HERO SECTION
    ====================================== -->

    <div id="hero">
        <h1>Coding Club</h1>
        <p>Learn. Build. Share.</p>
    </div>


    <!-- =====================================
         UPCOMING EVENTS SECTION
    ====================================== -->

    <div class="card">

        <h2>Upcoming Events</h2>

        <table>
            <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Venue</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>HTML Workshop</td>
                    <td>12 Nov</td>
                    <td>Lab 1</td>
                </tr>

                <tr>
                    <td>Hackathon</td>
                    <td>20 Nov</td>
                    <td>Seminar Hall</td>
                </tr>
            </tbody>
        </table>

    </div>


    <!-- =====================================
         REGISTRATION SECTION
    ====================================== -->

    <div class="card">

        <h2>Register</h2>

        <form>
            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
            >

            <button type="submit">Register</button>
        </form>

    </div>


    <!-- =====================================
         5.5: COLOUR CHOICE EXPLANATION

         1. Blue represents trust and gives
            the page a professional look.

         2. A light background makes the page
            look clean and attractive.

         3. Dark text on a light background
            improves readability.
    ====================================== -->

</body>
</html>
